<!DOCTYPE html>
<html>
<head>
  <link rel="manifest" href="manifest.json">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Contact Book - Group 16</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
<h1>📒 Contact Book</h1>
<p>EMCICT311 - Group 16 Project</p>

<div class="form-card">
<h2>Add New Contact</h2>
<form id="contactForm" onsubmit="return false;">
<input type="text" id="name" placeholder="Full Name" required>
<input type="tel" id="phone" placeholder="Phone (11 digits)" required>
<input type="email" id="email" placeholder="Email" required>
<input type="text" id="address" placeholder="Address" required>
<button type="button" onclick="addContact()" class="btn-save">Save Contact</button>
</form>
</div>

<div class="search-box">
<input type="text" id="search" placeholder="🔍 Search by name or phone..." onkeyup="render()">
<span id="count">0 contacts</span>
</div>

<table>
<thead><tr><th>Name</th><th>Phone</th><th>Email</th><th>Address</th><th>Action</th></tr></thead>
<tbody id="contactList"></tbody>
</table>
</div>
<script src="script.js"></script>
</body>
</html>
